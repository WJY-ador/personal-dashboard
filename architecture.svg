      <title id="personal-dashboard-title">개인 대시보드 시스템 흐름</title>
      <desc id="personal-dashboard-desc">무인 수집기가 쌓은 수집 피드를 표준 라이브러리 서버가 읽어 화면에 보이고, 사용자가 화면에서 판별·지시하면 서버가 작업 큐에 카드를 적고 서버 밖 워커가 구독 CLI로 결과를 큐에 쓰며 알림을 보내고, 사용자가 제출한 문장만 서버가 그대로 일지·판단 기록에 반영하는 구조로, 서버와 워커 사이에 모델 호출 경계가 있다.</desc>
